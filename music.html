<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>music</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="layout">
      <header>
        <h1 class="band-name-stylized"><a href="/">Stars of Heaven</a></h1>
        <nav>
          <ul>
            <li>
              <a class="nav-link" href="/index.html"><div>Stars of Heaven</div></a>
            </li>
            <li>
              <a class="nav-link" href="/members.html"><div>Members</div></a>
            </li>
            <li>
              <a class="nav-link current" href="/music.html"><div>Music</div></a></li>
          </ul>
        </nav>
      </header>
      <main>
        <fieldset>
          <ul class="album-list">
            <div>
              <div class="cover-art"></div>
              <li>
                <input type="checkbox" name="albums" id="animals"/>
                <label for="animals">
                  <div class="album-label">animals</div>
                </label>
                <ol class="song-list">
                  <li>snake</li>
                  <li>cow</li>
                  <li>sheep</li>
                  <li>bull</li>
                  <li>dog</li>
                  <li>cat</li>
                  <li>swan</li>
                </ol>
              </li>
            </div>
            <div>
              <div class="cover-art"></div> 
              <li>
                <input type="checkbox" name="albums" id="colours"/>
                <label for="colours">
                  <div class="album-label">colours</div>
                </label>
                <ol class="song-list">
                  <li>blue</li>
                  <li>green</li>
                  <li>red</li>
                  <li>orange</li>
                  <li>yellow</li>
                </ol>
              </li>
            </div>
          </ul>
        </fieldset>
      </main>
    </div>
  </body>
</html>
