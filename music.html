<!doctype html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>music</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header>
      <h1 class="band-name-stylized"><a href="/">Stars of Heaven</a></h1>
      <nav>
        <ul>
          <li>
            <a class="nav-link" href="/">
              <div>Stars of Heaven</div>
            </a>
          </li>
          <li>
            <a class="nav-link" href="/members.html">
              <div>Members</div>
            </a>
          </li>
          <li>
            <a class="nav-link current" href="/music.html">
              <div>Music</div>
            </a>
          </li>
        </ul>
      </nav>
    </header>
    <main>
      <ul class="album-list">
        <li>
          <img class="cover-art" src="/assets/covers/lamb.avif" alt="cover art for the album animals, photo of a sheep">
          <label class="album-label">
            <input type="checkbox" />
            animals
          </label>
          <ol class="song-list">
            <li>snake</li>
            <li>cow</li>
            <li>sheep</li>
            <li>bull</li>
            <li>dog</li>
            <li>cat</li>
            <li>swan</li>
          </ol>
        </li>
        <li>
          <img class="cover-art" src="/assets/covers/colours.avif" alt="cover art for the album colours, photo of colouring pencils">
          <label class="album-label">
            <input type="checkbox" />
            colours
          </label>
          <ol class="song-list">
            <li>blue</li>
            <li>green</li>
            <li>red</li>
            <li>orange</li>
            <li>yellow</li>
            <li>violet</li>
          </ol>
        </li>
      </ul>
    </main>
    <footer>
      <a href="/licenses.html">licenses</a>
    </footer>
  </body>
</html>
